# ============================================================================
# NETLIFY CI/CD DEPLOYMENT WORKFLOW
# ============================================================================
# Automatically deploys to Netlify on push to main branch
# Requires GitHub Secrets: NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID

name: Deploy to Netlify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_type:
        description: 'Deployment type'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

env:
  NODE_VERSION: '20'

jobs:
  # ============================================================================
  # BUILD JOB
  # ============================================================================
  build:
    name: Build & Deploy
    runs-on: ubuntu-latest
    
    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Run linting (optional but recommended)
      - name: Run linter
        run: npm run lint || true

      # Run type checking (optional but recommended)
      - name: Type check
        run: npm run type-check || true

      # Install Netlify CLI
      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      # Build and deploy to Netlify
      - name: Deploy to Netlify
        id: netlify_deploy
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Deploy preview for PRs
            netlify deploy \
              --build \
              --context deploy-preview \
              --site ${{ secrets.NETLIFY_SITE_ID }} \
              --auth ${{ secrets.NETLIFY_AUTH_TOKEN }} \
              --json > deploy-output.json
            
            echo "Deployed preview"
          else
            # Production deploy for main branch
            netlify deploy \
              --build \
              --prod \
              --site ${{ secrets.NETLIFY_SITE_ID }} \
              --auth ${{ secrets.NETLIFY_AUTH_TOKEN }} \
              --json > deploy-output.json
            
            echo "Deployed to production"
          fi
          
          # Extract deploy URL
          DEPLOY_URL=$(cat deploy-output.json | jq -r '.deploy_url // .url')
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
        env:
          SKIP_ENV_VALIDATION: 'true'
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          GITHUB_REDIRECT_URI: ${{ secrets.GITHUB_REDIRECT_URI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_ALCHEMY_RPC_URL: ${{ secrets.NEXT_PUBLIC_ALCHEMY_RPC_URL }}
          NEXT_PUBLIC_EQUITY_CONTRACT_ADDRESS: ${{ secrets.NEXT_PUBLIC_EQUITY_CONTRACT_ADDRESS }}

      # Comment on PR with deploy preview URL
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const deployUrl = '${{ steps.netlify_deploy.outputs.deploy_url }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Deploy Preview Ready!**\n\n📦 Preview URL: ${deployUrl}\n\n_Deployed by Netlify via GitHub Actions_`
            });

  # ============================================================================
  # POST-DEPLOY NOTIFICATION (optional)
  # ============================================================================
  notify:
    name: Post-Deploy Notification
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Deployment Success Notification
        run: |
          echo "🎉 Successfully deployed GhostFounder to production!"
          echo "Check your Netlify dashboard for the live URL."
